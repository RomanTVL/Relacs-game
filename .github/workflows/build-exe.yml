name: Сборка Relacs.exe

on:
  push:
    branches: [main, master, claude/keen-fermat-b06xcc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install pygame pyinstaller

      - name: Сборка Relacs.exe
        shell: pwsh
        run: |
          $data = Get-ChildItem *.mp3, iop.ogg, icon.png | ForEach-Object { "--add-data=$($_.Name);." }
          python -m PyInstaller --noconfirm --onefile --windowed --name Relacs --icon icon.ico @data Relacs.py

      - name: Сборка StarStorm.exe
        shell: pwsh
        run: |
          $files = "Relacs2.mp3", "burning.mp3", "under the moon.mp3", "haos.mp3", "Glitc.mp3", "night.mp3", "harmony_music.mp3", "star_icon.png"
          $data = $files | ForEach-Object { "--add-data=$_;." }
          python -m PyInstaller --noconfirm --onefile --windowed --name StarStorm --icon star_icon.ico @data StarStorm.py

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/*.exe

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Relacs + Звёздный шторм — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Relacs.exe
            dist/StarStorm.exe
          make_latest: true
          body: |
            **Relacs.exe** — сборник медитативных режимов.
            **StarStorm.exe** — «Звёздный шторм», космический рогалик по мотивам «Космического шторма».
            Установка не нужна, музыка внутри. Сохранения: %APPDATA%\Relacs и %APPDATA%\StarStorm.
